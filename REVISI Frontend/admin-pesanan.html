<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Keuangan & Pesanan</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .back-link { color: #007BFF; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 15px; }
        .revenue-box { background-color: #1a1a1a; color: white; text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .revenue-box p { margin: 0; font-size: 12px; color: #ccc; }
        .revenue-box h2 { margin: 5px 0 0 0; font-size: 24px; }
        .order-item { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .order-item p { margin: 4px 0; font-size: 14px; }
        .order-time { color: #777; font-size: 12px !important; }
        .order-total { font-weight: bold; font-size: 15px !important; margin-top: 8px !important; }
        .action-buttons { display: flex; gap: 10px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-jnt { background-color: #e74c3c; }
        .btn-success { background-color: #4CAF50; }
        
        /* Pesan jika semua order kosong */
        .empty-state { text-align: center; color: #777; font-style: italic; display: none; padding: 20px 0;}
    </style>
</head>
<body>

    <div class="container">
        <a href="admin.html" class="back-link">⬅️ Kembali ke Dashboard</a>
        <h2>Keuangan</h2>

        <div class="revenue-box">
            <p>Total Pendapatan</p>
            <h2 id="total-pendapatan">Rp 0</h2>
        </div>

        <h2>Daftar Pesanan</h2>
<div id="wadah-pesanan"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Tampilkan Saldo Pendapatan
    let saldoTersimpan = localStorage.getItem('totalPendapatan') || 0;
    let elemenKeuangan = document.getElementById('total-pendapatan'); 
    if (elemenKeuangan) {
        elemenKeuangan.innerText = 'Rp ' + parseInt(saldoTersimpan).toLocaleString('id-ID');
    }

    // Ambil data pesanan
    let daftarPesanan = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
    let wadah = document.getElementById('wadah-pesanan');

    if (wadah) {
        if (daftarPesanan.length === 0) {
            wadah.innerHTML = "<p style='text-align:center; color:gray; margin-top:20px;'>Belum ada pesanan masuk.</p>";
        } else {
            wadah.innerHTML = ""; // Bersihkan wadah sebelum diisi
            
            daftarPesanan.forEach((order, index) => {
                // PROTEKSI KEBAL ERROR: Mengambil data dari format lama ATAU baru agar tidak crash
                let idPesanan = order.id || "ORD-" + Math.floor(1000 + Math.random() * 9000);
                let waktuPesanan = order.waktu || order.tanggal || "Waktu tidak tercatat";
                let totalPesanan = order.total || order.totalBayar || 0;
                let metodePesanan = order.metode || "QRIS";

                wadah.innerHTML += `
                    <div class="order-item" style="background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd;">
                        <p style="margin:5px 0;"><strong>ID:</strong> ${idPesanan}</p>
                        <p style="margin:5px 0; font-size:12px; color:gray;">Waktu: ${waktuPesanan}</p>
                        <p style="margin:5px 0;"><strong>Total:</strong> Rp ${Number(totalPesanan).toLocaleString('id-ID')}</p>
                        <p style="margin:5px 0;"><strong>Metode:</strong> ${metodePesanan}</p>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button style="background-color: #dc3545; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; flex: 1;" onclick="kirimJNT(${index})">Kirim via J&T</button>
                            <button style="background-color: #28a745; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; flex: 1;" onclick="tandaiSukses(${index})">Sukses</button>
                        </div>
                    </div>
                `;
            });
        }
    }
});

// Fungsi tombol Sukses
function tandaiSukses(index) {
    let daftarPesanan = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
    let pesananSelesai = daftarPesanan[index];
    
    let totalPesanan = pesananSelesai.total || pesananSelesai.totalBayar || 0;

    // Tambah nominal ke Total Pendapatan
    let saldoLama = parseInt(localStorage.getItem('totalPendapatan')) || 0;
    localStorage.setItem('totalPendapatan', saldoLama + parseInt(totalPesanan));

    // Hapus pesanan dari antrean
    daftarPesanan.splice(index, 1);
    localStorage.setItem('pesananMasuk', JSON.stringify(daftarPesanan));

    alert("Pesanan berhasil diselesaikan!");
    location.reload();
}

// Fungsi tombol J&T biar tidak eror saat diklik
function kirimJNT(index) {
    alert("Pesanan diproses untuk dikirim via J&T!");
}
    </script>
</body>
</html>
