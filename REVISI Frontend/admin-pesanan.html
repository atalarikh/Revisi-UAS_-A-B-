<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pesanan & Keuangan - iPhone 17</title>
    <style>
        /* CSS Bingkai iPhone 17 */
        body { margin: 0; background-color: #d1d5db; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
        .mobile-frame { width: 390px; height: 844px; background: white; padding: 60px 20px 20px 20px; border: 14px solid #1a1a1a; border-radius: 45px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow-y: auto; box-sizing: border-box; }
        .mobile-frame::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background-color: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 999; }
        .mobile-frame::-webkit-scrollbar { display: none; }

        /* Konten Halaman */
        .header { font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; background: #fafafa; }
        .title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .total-box { background: #000; color: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="back-link" onclick="window.location.href='admin.html'">⬅️ Kembali ke Dashboard</div>
        
        <h2>Keuangan</h2>
        <div class="total-box">
            <div style="font-size: 12px;">Total Pendapatan</div>
            <div id="total-pendapatan" style="font-size: 24px; font-weight: bold;">Rp 0</div>
        </div>

        <h2>Daftar Pesanan</h2>
        <div id="list-pesanan"></div>
    </div>

    <script>
        const pesananMasuk = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
        const listContainer = document.getElementById('list-pesanan');
        let totalUang = 0;

        if (pesananMasuk.length === 0) {
            listContainer.innerHTML = "<p>Tidak ada pesanan.</p>";
        } else {
            pesananMasuk.forEach(order => {
                totalUang += order.totalBayar;
                listContainer.innerHTML += `
                    <div class="card">
                        <div class="title">ID: ${order.idOrder}</div>
                        <div style="font-size: 13px; color: #666;">Waktu: ${order.tanggal}</div>
                        <div style="font-weight: bold; margin-top: 10px;">Total: Rp ${order.totalBayar.toLocaleString()}</div>
                    </div>
                `;
            });
        }
        document.getElementById('total-pendapatan').innerText = "Rp " + totalUang.toLocaleString();
    </script>
</body>
</html>
