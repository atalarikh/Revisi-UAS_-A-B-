<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checkout - iPhone 17</title>
    <style>
        /* CSS Bingkai iPhone 17 */
        body { margin: 0; background-color: #d1d5db; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .mobile-frame { width: 390px; height: 844px; background: white; padding: 60px 20px 20px 20px; border: 14px solid #1a1a1a; border-radius: 45px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow-y: auto; box-sizing: border-box; }
        .mobile-frame::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background-color: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 999; }
        .mobile-frame::-webkit-scrollbar { display: none; }

        /* CSS Konten */
        .header { font-weight: bold; font-size: 18px; cursor: pointer; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .item-card { display: flex; gap: 15px; margin: 15px 0; align-items: center; }
        .item-card img { width: 65px; height: 65px; object-fit: cover; border-radius: 12px; }
        .btn-order { background: #00FF00; padding: 15px; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="mobile-frame">
    <a href="home.html" class="btn-kembali">⬅️ Kembali</a>
    <h2>Checkout</h2>

    <div id="wadah-keranjang"></div>

    <div class="pilihan-metode">
        <label style="font-weight: bold;">Pilih Metode Pembayaran:</label>
        <select id="metode">
            <option value="QRIS">QRIS</option>
            <option value="Transfer Bank">Transfer Bank</option>
            <option value="COD">COD (Bayar di Tempat)</option>
        </select>
    </div>

    <div class="total-section">
        Total: <span id="chk-total">Rp 0</span>
    </div>

    <button class="btn-order" onclick="prosesOrder()">Order Sekarang</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 1. Ambil data keranjang dari memori browser
    const keranjang = JSON.parse(localStorage.getItem('keranjang')) || [];
    const wadah = document.getElementById('wadah-keranjang');
    let total = 0;

    // 2. Cek apakah keranjang kosong
    if (keranjang.length === 0) {
        wadah.innerHTML = "<p style='color:gray; text-align:center; margin-top:20px;'>Keranjang Anda kosong belom ada barang.</p>";
        document.getElementById('chk-total').innerText = "Rp 0";
        return;
    }

    // 3. Bersihkan wadah dan render produk yang ada di keranjang
    wadah.innerHTML = "";
    keranjang.forEach(item => {
        total += item.price; // Tambahkan harga produk ke total
        
        wadah.innerHTML += `
            <div class="item-card">
                <img src="${item.img || 'https://via.placeholder.com/60'}" alt="${item.name}">
                <div class="item-info">
                    <p><strong>${item.name}</strong></p>
                    <p style="color: #e44d26;">Rp ${item.price.toLocaleString('id-ID')}</p>
                </div>
            </div>
        `;
    });

    // 4. Tampilkan total harga dengan format rupiah
    document.getElementById('chk-total').innerText = "Rp " + total.toLocaleString('id-ID');
});

// 5. Fungsi ketika tombol "Order Sekarang" diklik
function prosesOrder() {
    let keranjang = JSON.parse(localStorage.getItem('keranjang')) || [];
    if (keranjang.length === 0) {
        alert("Keranjang belanja Anda kosong! Silakan tambahkan barang dulu di toko.");
        return;
    }

    // Hitung total nilai belanja
    let totalBelanja = 0;
    keranjang.forEach(item => {
        totalBelanja += item.price;
    });

    // Ambil opsi pembayaran yang dipilih oleh user
    let metodeElement = document.getElementById('metode');
    let metodeTerpilih = metodeElement ? metodeElement.value : "QRIS";

    // Buat data transaksi baru yang lengkap & aman (anti-undefined)
    let pesananBaru = {
        id: "ORD-" + Math.floor(100000 + Math.random() * 900000), // Membuat nomor ID acak unik
        barang: keranjang,
        total: totalBelanja,          // Untuk script admin versi baru
        totalBayar: totalBelanja,     // Cadangan untuk script admin versi lama
        waktu: new Date().toLocaleString('id-ID'),
        tanggal: new Date().toLocaleString('id-ID'), 
        metode: metodeTerpilih
    };

    // Ambil data antrean pesanan yang sudah ada di admin, lalu tumpuk dengan pesanan baru
    let dataPesananAdmin = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
    dataPesananAdmin.push(pesananBaru);
    localStorage.setItem('pesananMasuk', JSON.stringify(dataPesananAdmin));

    // Notifikasi sukses
    alert("Pesanan Berhasil Dibuat! Silakan cek dashboard admin.");
    
    // Kosongkan keranjang belanja karena sudah dibeli
    localStorage.removeItem('keranjang');
    
    // Lempar kembali user ke halaman toko utama
    window.location.href = 'home.html';
}
</script>

</body>
</html>
