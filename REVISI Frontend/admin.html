<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .back-link { color: #007BFF; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 15px; }
        
        .grid-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; text-align: center; }
        .box-title { background-color: #1a1a1a; color: white; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: block;}
        .box-value h2 { margin: 15px 0 5px 0; font-size: 22px; color: #333; }
        .box-value p { margin: 0; font-size: 12px; color: #777; }
        
        .main-btn { display: block; width: 100%; background-color: #d9534f; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="admin-login.html" class="back-link">⬅️ Logout</a>
        <h1>Dashboard Admin</h1>

        <div class="grid-dashboard">
            <div>
                <a href="admin-pesanan.html" class="box-title">Pesanan</a>
                <div class="box-value">
                    <h2 id="jumlah-pesanan">0</h2>
                    <p>Perlu Dikirim</p>
                </div>
            </div>

            <div>
                <div class="box-title" style="cursor: default;">Keuangan</div>
                <div class="box-value">
                    <h2 id="dashboard-pendapatan">Rp 0</h2>
                    <p>Pendapatan</p>
                </div>
            </div>
        </div>

        <button class="main-btn">Tambah Produk</button>
        <button class="main-btn">Lihat Produk</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
    // Ambil data pesanan
    let daftarPesanan = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
    
    // Cari elemen angka 0 di HTML Anda (misal kita asumsikan Anda beri id="jumlah-pesanan")
    // Kalau di HTML Anda belum ada id="jumlah-pesanan", tambahkan id tersebut di tag angkanya.
    let elemenJumlah = document.getElementById('jumlah-pesanan'); 
    
    if(elemenJumlah) {
        elemenJumlah.innerText = daftarPesanan.length; // Ubah teks jadi jumlah pesanan
    }

    // Tampilkan Saldo di Dashboard
    let saldo = localStorage.getItem('totalPendapatan') || 0;
    let elemenSaldo = document.getElementById('saldo-dashboard');
    if(elemenSaldo) {
        elemenSaldo.innerText = 'Rp ' + parseInt(saldo).toLocaleString('id-ID');
    }
});
    </script>
</body>
</html>
