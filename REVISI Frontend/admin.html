<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { margin: 0; background-color: #d1d5db; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .mobile-frame { width: 390px; height: 844px; background: white; padding: 60px 20px 20px 20px; border: 14px solid #1a1a1a; border-radius: 45px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; }
        .mobile-frame::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background-color: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 999; }
        
        .btn-logout { width: 100%; text-align: left; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .brand-title { font-size: 32px; font-weight: bold; margin-bottom: 30px; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-black { background: black; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .info-card { background: #f9f9f9; border: 1px solid #eee; border-radius: 12px; padding: 15px; text-align: center; }
        .info-number { font-size: 20px; font-weight: bold; }
        .info-label { font-size: 11px; color: #666; margin-top: 5px; }
        
        .btn-tambah { background: #d32f2f; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: auto; }
    </style>
</head>
<body>
    <div class="mobile-frame">
        <div class="btn-logout" onclick="window.location.href='admin-login.html'">⬅️ Logout</div>
        <div class="brand-title">Dashboard Admin</div>

        <div class="grid-container">
            <button class="btn-black" onclick="window.location.href='admin-pesanan.html'">Pesanan</button>
            <button class="btn-black">Keuangan</button>
            <div class="info-card">
                <div class="info-number" id="angka-dikirim">0</div>
                <div class="info-label">Perlu Dikirim</div>
            </div>
            <div class="info-card">
                <div class="info-number" id="angka-keuangan">Rp 0</div>
                <div class="info-label">Pendapatan</div>
            </div>
        </div>

        <button class="btn-tambah" onclick="window.location.href='tambah-produk.html'">+ Tambah Produk</button>
    </div>

    <script>
        const pesananMasuk = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
        document.getElementById('angka-dikirim').innerText = pesananMasuk.length;
        let total = pesananMasuk.reduce((sum, order) => sum + order.totalBayar, 0);
        document.getElementById('angka-keuangan').innerText = "Rp " + total.toLocaleString('id-ID');
    </script>
</body>
</html>
