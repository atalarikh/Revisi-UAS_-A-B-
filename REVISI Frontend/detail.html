<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Produk - iPhone 17</title>
    <style>
        /* CSS Bingkai iPhone 17 (Sama untuk semua file) */
        body { margin: 0; background-color: #d1d5db; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
        .mobile-frame { width: 390px; height: 844px; background: white; padding: 60px 20px 20px 20px; border: 14px solid #1a1a1a; border-radius: 45px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow-y: auto; box-sizing: border-box; }
        .mobile-frame::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background-color: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 999; }
        .mobile-frame::-webkit-scrollbar { display: none; }

        /* CSS Halaman Detail */
        .header { font-weight: bold; font-size: 18px; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .product-img { width: 100%; height: 350px; object-fit: cover; border-radius: 20px; }
        .title { font-size: 24px; font-weight: bold; margin-top: 20px; }
        .price { font-size: 26px; font-weight: bold; color: #d32f2f; margin: 10px 0; }
        .btn-checkout { background: #000; color: #fff; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="header" onclick="window.location.href='home.html'">⬅️ Kembali</div>
        
        <img id="detail-img" class="product-img" src="" alt="Produk">
        
        <div class="title" id="detail-title">Nama Produk</div>
        <div class="price" id="detail-price">Rp 0</div>
        
        <button class="btn-checkout" onclick="tambahKeKeranjang()">Tambah ke Keranjang</button>
    </div>

    <script>
        const product = JSON.parse(localStorage.getItem('selectedProduct'));
        
        if (product) {
            document.getElementById('detail-img').src = product.img;
            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerText = "Rp " + product.price.toLocaleString('id-ID');
        }

        function tambahKeKeranjang() {
            let keranjang = JSON.parse(localStorage.getItem('keranjang')) || [];
            keranjang.push(product);
            localStorage.setItem('keranjang', JSON.stringify(keranjang));
            alert("Berhasil masuk keranjang!");
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
