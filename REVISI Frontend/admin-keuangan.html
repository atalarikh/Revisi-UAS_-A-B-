<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-frame {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            padding: 25px;
            box-sizing: border-box;
        }
        .btn-back {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .card-pendapatan {
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }
        .card-pendapatan p {
            margin: 0 0 10px 0;
            color: #aaa;
            font-size: 14px;
        }
        .card-pendapatan h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        h3 {
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: #333;
        }
        .Log-kosong {
            color: #888;
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="admin-frame">
    <a href="admin.html" class="btn-back">⬅️ Kembali ke Dashboard</a>
    <h2>Keuangan</h2>

    <div class="card-pendapatan">
        <p>Total Pendapatan</p>
        <h2 id="total-pendapatan">Rp 0</h2>
    </div>

    <h3>Daftar Pesanan Selesai</h3>
    <div id="log-pesanan-selesai">
        <p class="Log-kosong">Belum ada riwayat transaksi masuk.</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 1. Muat saldo pendapatan dari memori browser
    let saldoTersimpan = localStorage.getItem('totalPendapatan');
    let elemenKeuangan = document.getElementById('total-pendapatan');
    
    if (saldoTersimpan && elemenKeuangan) {
        let saldoAngka = parseInt(saldoTersimpan);
        // 2. Tampilkan uang dengan format mata uang Rupiah Indonesia yang rapi
        elemenKeuangan.innerText = 'Rp ' + saldoAngka.toLocaleString('id-ID');
    } else if (elemenKeuangan) {
        elemenKeuangan.innerText = 'Rp 0';
    }
});
</script>

</body>
</html>
