<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pesanan Saya</title>
    <style>
        /* CSS Bingkai iPhone 17 */
        body { margin: 0; background-color: #d1d5db; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
        .mobile-frame { width: 390px; height: 844px; background: white; padding: 60px 20px 20px 20px; border: 14px solid #1a1a1a; border-radius: 45px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow-y: auto; box-sizing: border-box; }
        .mobile-frame::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background-color: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 999; }
        .mobile-frame::-webkit-scrollbar { display: none; }
        
        .header { font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="mobile-frame">
        <div class="header" onclick="window.location.href='home.html'">⬅️ Kembali</div>
        <h2>📦 Pesanan Saya</h2>
        <div id="list-pesanan-user"></div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('pesananMasuk')) || [];
        const wadah = document.getElementById('list-pesanan-user');
        
        if(data.length === 0) wadah.innerHTML = "<p>Belum ada pesanan.</p>";
        
        data.forEach(order => {
            wadah.innerHTML += `
                <div class="card">
                    <div style="font-weight:bold">ID: ${order.idOrder}</div>
                    <div style="color:#666; font-size:12px;">${order.tanggal}</div>
                    <div style="margin-top:10px;">Total: <b>Rp ${order.totalBayar.toLocaleString()}</b></div>
                    <div style="margin-top:5px; color:green;">Status: ${order.status}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
