<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - iPhone 17</title>
    <style>
        /* CSS Bingkai iPhone 17 */
        body { margin: 0; background-color: #d1d5db; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
        .mobile-frame { width: 390px; height: 844px; background: white; padding: 100px 30px 20px 30px; border: 14px solid #1a1a1a; border-radius: 45px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .mobile-frame::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background-color: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 999; }
        .mobile-frame::-webkit-scrollbar { display: none; }

        /* Style Login */
        .brand { font-size: 28px; font-weight: bold; margin-bottom: 40px; color: #d32f2f; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
        .btn-login { background: #d32f2f; color: #fff; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        .back-link { margin-top: 20px; font-size: 14px; color: #666; cursor: pointer; }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="brand">Admin Access</div>
        
        <input type="email" id="admin-email" placeholder="Email Admin">
        <input type="password" id="admin-pass" placeholder="Password Admin">
        
        <button class="btn-login" onclick="cekAdmin()">Masuk Dashboard</button>
        
    </div>

    <script>
        function cekAdmin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            
            // Logika login admin (Ganti sesuai kebutuhan)
            if (email === "admin@toko.com" && pass === "admin123") {
                window.location.href = 'admin.html';
            } else {
                alert("Email atau Password Admin salah!");
            }
        }
    </script>
</body>
</html>
