<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk - Figma Design</title>
    <style>
        /* Reset Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e9ecef; /* Warna latar belakang abu-abu di luar HP */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Wadah Utama ala Layar HP */
        .app-container {
            width: 100%;
            max-width: 400px; /* Ukuran standar layar mobile */
            background-color: #ffffff;
            min-height: 800px;
            padding: 20px 24px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 30px; /* Sudut membulat seperti HP */
            overflow: hidden;
        }

        /* Bagian Header */
        .header {
            display: flex;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #000;
            width: 30px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            flex-grow: 1;
            text-align: center;
            margin-right: 30px; /* Agar teks benar-benar di tengah mengimbangi ikon back */
        }

        /* Kotak Tambah Foto (Warna Pink Soft) */
        .upload-box {
            width: 110px;
            height: 100px;
            background-color: #F8D7DA; /* Warna pink dari desain */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
            cursor: pointer;
        }

        .upload-box span {
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        .upload-box input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Baris Form Input */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #111;
            white-space: nowrap;
        }

        .form-input {
            flex-grow: 1;
            border: none;
            text-align: left;
            margin-left: 20px;
            outline: none;
            font-size: 14px;
            color: #333;
            background: transparent;
        }

        .form-input::placeholder {
            color: #A0A0A0;
        }

        .chevron {
            color: #C0C0C0;
            font-size: 16px;
            margin-left: 10px;
        }

        /* Bagian Tombol Bawah */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 100px;
        }

        .btn {
            background-color: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 0;
            width: 130px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Garis Indikator Home iOS (opsional agar makin mirip mockup) */
        .home-indicator {
            width: 130px;
            height: 4px;
            background-color: #000;
            border-radius: 10px;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.history.back()">&#8249;</button>
            <div class="header-title">Kembali</div>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- Tambah Foto -->
            <div class="upload-box">
                <span>Tambah Foto</span>
                <input type="file" name="foto" accept="image/*">
            </div>

            <!-- List Input -->
            <div class="form-row">
                <div class="form-label">Nama Produk</div>
                <input type="text" class="form-input" placeholder="Masukan nama produk">
                <div class="chevron">&#8250;</div>
            </div>

            <div class="form-row">
                <div class="form-label">Deskripsi Produk</div>
                <input type="text" class="form-input" placeholder="Masukan deskripsi produk">
                <div class="chevron">&#8250;</div>
            </div>

            <div class="form-row">
                <div class="form-label">Harga</div>
                <input type="number" class="form-input" placeholder="">
                <div class="chevron">&#8250;</div>
            </div>

            <div class="form-row">
                <div class="form-label">Stok</div>
                <input type="number" class="form-input" placeholder="">
                <div class="chevron">&#8250;</div>
            </div>

            <!-- Tombol Aksi -->
            <div class="button-group">
                <button type="submit" class="btn">Simpan</button>
                <button type="button" class="btn">Tampilkan</button>
            </div>

        </form>

        <!-- Home Indicator Garis Bawah (Estetika) -->
        <div class="home-indicator"></div>

    </div>

</body>
</html>
